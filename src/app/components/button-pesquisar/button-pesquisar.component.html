<header class="header-bar" [class]="selectedType">

  <div class="search-container">
    <div class="input-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Pesquisar Pokémon..." [(ngModel)]="searchTerm" />
    </div>

    <select [(ngModel)]="selectedType">
      <option value="">Todos os Tipos</option>
      <option *ngFor="let p of pokemons" [value]="p.type">{{ p.name }}</option>
    </select>
    

    <div class="view-toggle">
      <button 
        type="button"
        [class.active]="viewMode === 'grid'" 
        (click)="changeView('grid')" 
        title="Modo Grade">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
      <button 
        type="button"
        [class.active]="viewMode === 'list'" 
        (click)="changeView('list')" 
        title="Modo Lista">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="type-marquee">
    <div class="marquee-track">
      <span *ngFor="let p of pokemons" class="marquee-badge" [class]="p.type">
        {{ p.type }}
      </span>
      <span *ngFor="let p of pokemons" class="marquee-badge" [class]="p.type">
        {{ p.type }}
      </span>
    </div>
  </div>
</header>

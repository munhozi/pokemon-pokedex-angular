<header class="header-bar" [class]="selectedType">
  <div class="search-container">
    <div class="input-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        placeholder="Pesquisar Pokémon..." 
        [(ngModel)]="searchTerm" 
      />
    </div>

    <select [(ngModel)]="selectedType">
      <option value="">Todos os Tipos</option>
      <option *ngFor="let p of pokemons" [value]="p.type">
        {{ p.name }}
      </option>
    </select>
  </div>

  <div class="type-marquee">
    <div class="marquee-track">
      <span *ngFor="let p of pokemons" class="marquee-badge" [class]="p.type">
        {{ p.type }}
      </span>
      <!-- Duplicado para manter o loop continuo e fluido -->
      <span *ngFor="let p of pokemons" class="marquee-badge" [class]="p.type">
        {{ p.type }}
      </span>
    </div>
  </div>
</header>
